name: Deploy mockup to GitHub Pages

# Publishes the static mockup on every push to main.
# configure-pages (enablement: true) auto-enables Pages on the first run, so no
# manual Settings toggle is needed for a personal public repo.
#
# IMPORTANT: BASE_PATH must match the repo name (project site is served at
# username.github.io/<repo>/). If the repo is NOT named "edu-ai-mockup",
# change BASE_PATH below to "/<your-repo-name>/".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BASE_PATH: /edu-ai-mockup/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Astro 6 requires Node >=22.12
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Configure Pages (auto-enable)
        uses: actions/configure-pages@v4
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
